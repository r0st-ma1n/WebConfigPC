[project]
name = "webconfigpc"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # Depends(...) в аргументах по умолчанию — стандартный приём FastAPI
    "RUF001",  # кириллица в строках и комментариях — не ошибка
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"backend/app/models.py" = ["RUF012"]  # __mapper_args__ — так требует SQLAlchemy
"backend/migrations/env.py" = ["E402"]
"backend/migrations/versions/*" = ["E501", "W291"]  # файлы генерирует Alembic

[tool.mypy]
python_version = "3.14"
mypy_path = "backend"
packages = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
