name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pcbuilder
          POSTGRES_PASSWORD: pcbuilder
          POSTGRES_DB: pcbuilder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcbuilder"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pcbuilder:pcbuilder@localhost:5432/pcbuilder
      # Только для test_redis.py: само приложение в тестах работает без Redis
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check backend
          uv run ruff format --check backend
      - name: Mypy
        run: uv run mypy
        working-directory: backend
      # Миграции и сид на чистой базе: тест загрузки из PostgreSQL в CI не пропускается
      - name: Migrations and seed
        run: |
          uv run alembic upgrade head
          uv run python -m app.seed
        working-directory: backend
      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Типы API генерируются из OpenAPI-схемы бэкенда. Если Pydantic-схему поменяли,
      # а схему и типы во фронтенде не обновили, проверка падает
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: API types match backend
        run: |
          uv run --frozen --no-dev --project .. python ../backend/scripts/export_openapi.py
          npm run gen:api
          git diff --exit-code -- openapi.json src/api-schema.ts || {
            echo "::error::Схема API изменилась. Выполните: uv run python backend/scripts/export_openapi.py && (cd frontend && npm run gen:api)"
            exit 1
          }
      - run: npm run lint
      - run: npm test
      - name: Type check and build
        run: npm run build
      # Браузер кэшируется по версии Playwright. Без --with-deps: системные библиотеки
      # на раннере уже есть, а шрифты через apt иногда качаются по 10 минут
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: E2E tests
        run: |
          npx playwright install chromium
          npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8090/api/health
          curl -fsS -X POST http://localhost:8090/api/recommend \
            -H 'Content-Type: application/json' \
            -d '{"budget": 120000, "scenario": "gaming", "resolution": "1440p"}' > /dev/null
      # Конфиг Prometheus и правила алертов, затем весь мониторинг: Prometheus должен
      # видеть бэкенд, а Grafana — загрузить дашборд из репозитория
      - name: Monitoring
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.7.3 check config /etc/prometheus/prometheus.yml
          docker compose --profile monitoring up -d prometheus grafana
          # nginx не отдаёт метрики наружу (на /metrics придёт страница фронтенда)
          ! curl -fsS http://localhost:8090/metrics | grep -q http_requests_total
          for i in $(seq 30); do
            curl -fsS 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22backend%22%7D' | grep -q '"1"\]' && break
            sleep 2
          done
          curl -fsS 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22backend%22%7D' | grep -q '"1"\]'
          for i in $(seq 30); do
            curl -fsS http://localhost:3000/api/dashboards/uid/webconfigpc > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/dashboards/uid/webconfigpc | grep -q 'Конфигуратор ПК'
      - name: Logs on failure
        if: failure()
        run: docker compose --profile monitoring logs
