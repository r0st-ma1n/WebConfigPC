# Постоянные соединения с бэкендом. Без них nginx открывает новое TCP-соединение на каждый
# запрос, закрытые соединения ещё минуту занимают порт (TIME_WAIT), и под нагрузкой
# в сотни запросов в секунду порты кончаются: 502 «Address not available»
upstream backend {
    server backend:8000;
    keepalive 64;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # API отдаёт бэкенд — так же, как прокси Vite в режиме разработки
    location /api/ {
        proxy_pass http://backend;
        # keepalive к upstream работает только с HTTP/1.1 и без заголовка Connection: close
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Тот же id попадёт в логи бэкенда и вернётся клиенту в заголовке X-Request-ID
        proxy_set_header X-Request-ID $request_id;
        # Объяснение сборки приходит потоком (NDJSON): без буферизации текст виден сразу
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # Сборка Vite кладёт файлы с хешем в имени — их можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Маршруты фронтенда (/manual и т. д.) обрабатывает React
    location / {
        try_files $uri /index.html;
    }
}
