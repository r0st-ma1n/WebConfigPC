# Всё приложение: docker compose up -d --build  ->  http://localhost:8090
# Только база и Redis для локальной разработки: docker compose up -d db redis
services:
  db:
    image: postgres:17
    container_name: pcbuilder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Общие для воркеров бэкенда счётчики лимитов и версия каталога. Данные можно потерять
  # без последствий, поэтому без тома и без сохранения на диск
  redis:
    image: redis:7.4-alpine
    container_name: pcbuilder-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pcbuilder-backend
    restart: unless-stopped
    # Настройки LLM берутся из .env; адрес базы — внутри сети Compose, а не localhost
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
      # Воркеры uvicorn — отдельные процессы; лимиты общие для них благодаря Redis
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    # Локальная модель на хосте (LM Studio, Ollama) доступна как http://host.docker.internal:<порт>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Импорт цен по расписанию: docker compose --profile prices up -d
  # Прайс-лист кладётся в ./prices/prices.csv (формат — prices/prices.example.csv)
  prices:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pcbuilder-prices
    profiles: [prices]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    volumes:
      - ./prices:/data:ro
    command: ["python", "-m", "app.prices", "/data/prices.csv", "--every", "${PRICES_IMPORT_INTERVAL:-3600}"]
    depends_on:
      # Бэкенд при старте применяет миграции и заполняет базу
      backend:
        condition: service_healthy

  frontend:
    build: frontend
    container_name: pcbuilder-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
