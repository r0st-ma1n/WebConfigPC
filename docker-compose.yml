# Всё приложение: docker compose up -d --build  ->  http://localhost:8090
# Только база и Redis для локальной разработки: docker compose up -d db redis
services:
  db:
    image: postgres:17
    container_name: pcbuilder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Общие для воркеров бэкенда счётчики лимитов, версия каталога и кэш результатов подбора.
  # Данные можно потерять без последствий, поэтому без тома и без сохранения на диск.
  # Память ограничена: при нехватке вытесняются давно не использованные ключи с TTL
  # (записи кэша), а версия каталога без TTL остаётся
  redis:
    image: redis:7.4-alpine
    container_name: pcbuilder-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pcbuilder-backend
    restart: unless-stopped
    # Настройки LLM берутся из .env; адрес базы — внутри сети Compose, а не localhost
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
      RECOMMEND_CACHE_SECONDS: ${RECOMMEND_CACHE_SECONDS:-3600}
      # Метрики всех воркеров собираются через файлы в этой папке (app/metrics.py)
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      # Воркеры uvicorn — отдельные процессы; лимиты общие для них благодаря Redis
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    # Локальная модель на хосте (LM Studio, Ollama) доступна как http://host.docker.internal:<порт>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Импорт цен по расписанию: docker compose --profile prices up -d
  # Прайс-лист кладётся в ./prices/prices.csv (формат — prices/prices.example.csv)
  prices:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pcbuilder-prices
    profiles: [prices]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    volumes:
      - ./prices:/data:ro
    command: ["python", "-m", "app.prices", "/data/prices.csv", "--every", "${PRICES_IMPORT_INTERVAL:-3600}"]
    depends_on:
      # Бэкенд при старте применяет миграции и заполняет базу
      backend:
        condition: service_healthy

  frontend:
    build: frontend
    container_name: pcbuilder-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Нагрузочный тест (loadtest/k6.js): docker compose --profile loadtest run --rm k6 run -e SCENARIO=mixed /scripts/k6.js
  # Запросы идут через nginx, как у браузера
  k6:
    image: grafana/k6:1.4.0
    profiles: [loadtest]
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      - frontend

  # Мониторинг: docker compose --profile monitoring up -d
  # Prometheus — http://localhost:9090, Grafana — http://localhost:3000 (дашборд открывается сразу)
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: pcbuilder-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:12.2.1
    container_name: pcbuilder-grafana
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      # Смотреть дашборд можно без входа; менять — под admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/webconfigpc.json
    volumes:
      # Только свои подпапки: остальные (alerting, plugins) остаются из образа
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
